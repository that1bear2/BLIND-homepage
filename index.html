<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM_OVERRIDE // ARCHIVE_404</title>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            text-shadow: 0 0 5px #ffffff;
        }

        .terminal {
            width: 100%;
            max-width: 600px;
            border: 1px solid #ffffff;
            padding: 20px;
            background-color: #000;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .header {
            border-bottom: 1px dashed #ffffff;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .output {
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* --- HOMESCREEN MEDIA STYLES --- */
        .home-image {
            width: 100%;
            max-width: 200px; /* Keeps a logo size */
            display: block;
            margin: 15px auto;
            border: 1px solid #ffffff;
            filter: grayscale(100%) contrast(200%); /* Makes it look retro/glitchy */
        }

        .home-video {
            width: 100%;
            max-width: 500px;
            display: block;
            margin: 15px auto;
            border: 1px solid #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        .input-area {
            display: flex;
            align-items: center;
            margin-top: 20px;
        }

        .prompt {
            margin-right: 10px;
        }

        input[type="text"] {
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: inherit;
            font-size: 1rem;
            width: 100%;
            outline: none;
            text-shadow: 0 0 5px #ffffff;
        }
        
        /* Hidden content to reveal on success */
        #secret-content {
            display: none;
            border: 1px double #ffffff;
            padding: 15px;
            margin-top: 20px;
            background-color: rgba(255, 255, 255, 0.05);
            text-align: center; 
        }

        /* Success video style */
        .clue-video {
            width: 100%;
            max-width: 500px;
            margin-top: 15px;
            border: 1px solid #ffffff;
        }
    </style>
</head>
<body>

    <div class="terminal">
        <div class="header">
            SECURE TERMINAL . UNAUTHORIZED ACCESS PROHIBITED<br>
            DATE: 4/8/2019 . NODE: 0x99F
        </div>

        <div class="output" id="log">
            <p>> SYSTEM STATUS: LOCKED</p>
            
            <img src="blindimage.jpg" alt="BL/IND LOGO" class="home-image">

            <video class="home-video" autoplay loop muted playsinline>
                <source src="blindpills.mp4" type="video/mp4">
            </video>

            <p>> IF EMPLOYEE OF BL/IND INPUT DECRYPTION KEY TO PROCEED.</p>
            <p style="color: #ff3333;">> GUESS.</p>
        </div>

        <div class="input-area" id="interactive-input">
            <span class="prompt">USER@ROOT:$</span>
            <input type="text" id="user-input" autocomplete="off" autofocus>
        </div>

        <div id="secret-content">
            <p>> ACCESS GRANTED.</p>
            <p>> PLAYING CLUE_FILE_01.MP4...</p>
            
            <video id="clue-video" class="clue-video" controls>
                <source src="clue.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </div>

    <script>
        const inputField = document.getElementById('user-input');
        const logArea = document.getElementById('log');
        const secretContent = document.getElementById('secret-content');
        const inputArea = document.getElementById('interactive-input');
        const clueVideo = document.getElementById('clue-video');

        const CORRECT_ANSWER = "dr death";

        const successSound = new Audio('accessgranted.mp3');
        const failureSound = new Audio('accessdenied.mp3');

        inputField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const guess = inputField.value.trim().toLowerCase();
                inputField.value = '';

                if (guess === CORRECT_ANSWER) {
                    successSound.play().catch(err => console.log("Audio play blocked: ", err));

                    // Hide the entire original log screen (including homescreen media) and input
                    logArea.style.display = 'none';
                    inputArea.style.display = 'none';
                    
                    // Reveal hidden reward zone
                    secretContent.style.display = 'block';
                    clueVideo.play().catch(err => console.log("Video autoplay blocked: ", err));
                } else {
                    failureSound.play().catch(err => console.log("Audio play blocked: ", err));

                    const errorMessage = document.createElement('p');
                    errorMessage.style.color = '#ff3333';
                    errorMessage.textContent = `> Entering key: "${guess}"... ACCESS DENIED. TRY AGAIN.`;
                    logArea.appendChild(errorMessage);
                }
            }
        });
    </script>
</body>
</html>
